<div class="sobhi" data-sobhi-chat>
  <section class="sobhi-panel" id="sobhi-panel" data-sobhi-panel role="dialog" aria-modal="true" aria-labelledby="sobhi-title" hidden>
    <header class="sobhi-head">
      <span class="sobhi-avatar" aria-hidden="true">S</span>
      <span class="sobhi-head-copy">
        <strong id="sobhi-title">sobhi</strong>
        <small><span class="sobhi-status-dot" aria-hidden="true"></span>Virtual assistant</small>
      </span>
      <div class="sobhi-head-actions">
        <button class="sobhi-new-chat" type="button" data-sobhi-new-chat aria-label="Start a new chat" title="Start a new chat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="sobhi-new-chat-label">New chat</span>
        </button>
        <button class="sobhi-icon-btn" type="button" data-sobhi-lang aria-label="Change language">
          <svg width="16" height="16" aria-hidden="true"><use href="#i-globe"/></svg>
          <span data-sobhi-lang-label>EN</span>
        </button>
        <button class="sobhi-icon-btn" type="button" data-sobhi-close aria-label="Close chat">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>
    <div class="sobhi-messages" data-sobhi-messages role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="sobhi-chips" data-sobhi-chips hidden></div>
    <form class="sobhi-compose" data-sobhi-form novalidate>
      <label class="sr-only" for="sobhi-input">Type your message</label>
      <input data-sobhi-file-input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" hidden>
      <button class="sobhi-tool-btn" data-sobhi-attach type="button" aria-label="Upload an image or PDF" title="Upload an image or PDF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
      </button>
      <button class="sobhi-tool-btn" data-sobhi-mic type="button" aria-label="Record a voice question" title="Record a voice question">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg>
      </button>
      <input id="sobhi-input" data-sobhi-input type="text" placeholder="Type your message…" autocomplete="off" maxlength="500">
      <button class="sobhi-send" type="submit" aria-label="Send message">
        <svg width="18" height="18" aria-hidden="true"><use href="#i-send"/></svg>
      </button>
    </form>
    <p class="sobhi-note">Answers are indicative. Please confirm final terms with the lender.</p>
  </section>
</div>
