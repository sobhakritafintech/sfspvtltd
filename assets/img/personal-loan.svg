<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Personal loan illustration with a smartphone and rupee coins">
  <defs>
    <linearGradient id="p-arch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12866a"/>
      <stop offset="1" stop-color="#0c3f34"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8efdd"/>
  <circle cx="200" cy="142" r="128" fill="#f2dfc0"/>
  <path d="M86 262V152a114 114 0 0 1 228 0v110Z" fill="url(#p-arch)"/>
  <path d="M86 262V152a114 114 0 0 1 228 0v110" fill="none" stroke="#c89a4b" stroke-width="2" opacity="0.65"/>
  <g opacity="0.18" fill="#fff">
    <circle cx="128" cy="112" r="2"/><circle cx="152" cy="96" r="2"/><circle cx="276" cy="108" r="2"/>
    <circle cx="290" cy="140" r="2"/><circle cx="120" cy="164" r="2"/>
  </g>

  <!-- bank note behind phone -->
  <g transform="rotate(-16 150 190)">
    <rect x="94" y="168" width="78" height="42" rx="4" fill="#f2c14e"/>
    <rect x="100" y="174" width="66" height="30" rx="2" fill="none" stroke="#c89a4b" stroke-width="1.5"/>
    <circle cx="133" cy="189" r="9" fill="#fbf3e4"/>
    <text x="133" y="193" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#a8530a">&#8377;</text>
  </g>

  <!-- phone -->
  <rect x="152" y="78" width="96" height="166" rx="18" fill="#0c1f33"/>
  <rect x="159" y="86" width="82" height="150" rx="12" fill="#fbf6ec"/>
  <rect x="186" y="80" width="28" height="5" rx="2.5" fill="#1b3a56"/>
  <circle cx="200" cy="126" r="24" fill="#dd7517"/>
  <text x="200" y="134" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">&#8377;</text>
  <text x="200" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" letter-spacing="0.6" fill="#7d8c99">LOAN APPROVED</text>
  <rect x="176" y="170" width="48" height="6" rx="3" fill="#e8dccb"/>
  <rect x="170" y="183" width="60" height="6" rx="3" fill="#e8dccb"/>
  <rect x="170" y="200" width="60" height="15" rx="7.5" fill="#0e6b54"/>
  <text x="200" y="210.5" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="7" font-weight="700" fill="#fff">APPLY</text>
  <rect x="170" y="222" width="60" height="5" rx="2.5" fill="#e8dccb"/>

  <!-- coins -->
  <g>
    <circle cx="296" cy="222" r="20" fill="#f2c14e" stroke="#c89a4b" stroke-width="2"/>
    <circle cx="296" cy="222" r="13" fill="none" stroke="#c89a4b" stroke-width="1" opacity="0.6"/>
    <text x="296" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#a8530a">&#8377;</text>
    <circle cx="266" cy="246" r="11" fill="#f6d183" stroke="#c89a4b" stroke-width="1.5"/>
    <circle cx="322" cy="186" r="8" fill="#f6d183" stroke="#c89a4b" stroke-width="1.5" opacity="0.9"/>
  </g>

  <g stroke="#f2a03d" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M118 128l10-6M112 148l12 2M288 152l-10 6"/>
  </g>
