<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Business loan illustration of an Indian shopfront">
  <defs>
    <linearGradient id="b-arch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a03d"/>
      <stop offset="1" stop-color="#c2542f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8efdd"/>
  <circle cx="200" cy="142" r="128" fill="#f2dfc0"/>
  <path d="M86 262V152a114 114 0 0 1 228 0v110Z" fill="url(#b-arch)"/>
  <path d="M86 262V152a114 114 0 0 1 228 0v110" fill="none" stroke="#c89a4b" stroke-width="2" opacity="0.7"/>
  <circle cx="292" cy="96" r="22" fill="#f9cf95" opacity="0.85"/>

  <!-- shop -->
  <g>
    <rect x="118" y="158" width="164" height="94" fill="#fbf3e4"/>
    <rect x="118" y="158" width="164" height="94" fill="none" stroke="#d8c3a2" stroke-width="1.5"/>

    <!-- sign -->
    <rect x="139" y="110" width="122" height="32" rx="6" fill="#0c1f33"/>
    <rect x="143" y="114" width="114" height="24" rx="4" fill="none" stroke="#c89a4b" stroke-width="1" opacity="0.8"/>
    <circle cx="156" cy="126" r="8" fill="#dd7517"/>
    <text x="156" y="129.5" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#fff">&#8377;</text>
    <text x="170" y="130" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#f2c14e">SOBHAKRITA</text>

    <!-- awning -->
    <rect x="108" y="146" width="184" height="20" fill="#0e6b54"/>
    <g fill="#f2a03d">
      <rect x="108" y="146" width="23" height="20"/><rect x="154" y="146" width="23" height="20"/>
      <rect x="200" y="146" width="23" height="20"/><rect x="246" y="146" width="23" height="20"/>
    </g>
    <g fill="#0e6b54">
      <circle cx="131" cy="166" r="8"/><circle cx="177" cy="166" r="8"/><circle cx="223" cy="166" r="8"/><circle cx="269" cy="166" r="8"/>
    </g>
    <g fill="#f2a03d">
      <circle cx="154" cy="166" r="8"/><circle cx="200" cy="166" r="8"/><circle cx="246" cy="166" r="8"/>
    </g>

    <!-- door + window -->
    <rect x="180" y="198" width="44" height="54" rx="2" fill="#0e6b54"/>
    <rect x="184" y="202" width="36" height="26" rx="1.5" fill="#d8ece3" opacity="0.85"/>
    <circle cx="217" cy="230" r="2.5" fill="#c89a4b"/>
    <rect x="136" y="198" width="32" height="34" rx="2" fill="#cfe6dd" stroke="#0c1f33" stroke-width="1.5"/>
    <path d="M152 198v34M136 215h32" stroke="#0c1f33" stroke-width="1.2" opacity="0.6"/>
    <rect x="238" y="198" width="30" height="24" rx="2" fill="#cfe6dd" stroke="#0c1f33" stroke-width="1.5"/>
    <path d="M253 198v24M238 210h30" stroke="#0c1f33" stroke-width="1.2" opacity="0.6"/>

    <!-- step -->
    <rect x="108" y="252" width="184" height="9" rx="2" fill="#dcc7a4"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M296 226h26l-4 26h-18Z" fill="#c2542f"/>
    <rect x="293" y="222" width="32" height="6" rx="2" fill="#d96f12"/>
    <path d="M309 222c-2-14-8-20-16-22 2 12 7 19 16 22Z" fill="#0e6b54"/>
    <path d="M309 222c2-16 8-22 16-24-2 14-8 21-16 24Z" fill="#12866a"/>
    <path d="M309 220v-22" stroke="#0e6b54" stroke-width="2"/>
  </g>

  <!-- coins -->
  <g>
    <circle cx="112" cy="104" r="14" fill="#f2c14e" stroke="#c89a4b" stroke-width="1.5"/>
    <text x="112" y="109" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#a8530a">&#8377;</text>
    <circle cx="86" cy="132" r="9" fill="#f6d183" stroke="#c89a4b" stroke-width="1.2"/>
    <circle cx="316" cy="132" r="8" fill="#f6d183" stroke="#c89a4b" stroke-width="1.2"/>
  </g>
