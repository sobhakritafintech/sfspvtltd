    <rect x="126" y="214" width="10" height="20" fill="#0b5a46"/>
    <rect x="134" y="234" width="140" height="20" rx="3" fill="#dd7517"/>
    <rect x="134" y="234" width="10" height="20" fill="#b8541a"/>
    <rect x="118" y="254" width="164" height="20" rx="3" fill="#0c1f33"/>
