<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Industrial and MSME loan illustration of a small factory">
  <defs>
    <linearGradient id="i-arch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3a56"/>
      <stop offset="1" stop-color="#0c1f33"/>
    </linearGradient>
    <linearGradient id="i-fac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ee"/>
      <stop offset="1" stop-color="#e8d9bf"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8efdd"/>
  <circle cx="200" cy="142" r="128" fill="#f2dfc0"/>
  <path d="M86 262V152a114 114 0 0 1 228 0v110Z" fill="url(#i-arch)"/>
  <path d="M86 262V152a114 114 0 0 1 228 0v110" fill="none" stroke="#c89a4b" stroke-width="2" opacity="0.6"/>
  <circle cx="296" cy="96" r="17" fill="#f9cf95" opacity="0.75"/>

  <!-- smoke -->
  <g fill="#fbf3e4" opacity="0.5">
    <circle cx="276" cy="104" r="10"/>
    <circle cx="290" cy="88" r="13"/>
    <circle cx="308" cy="74" r="9"/>
  </g>

  <!-- factory -->
  <g>
    <rect x="272" y="120" width="22" height="72" rx="2" fill="#c2542f"/>
    <rect x="272" y="130" width="22" height="6" fill="#a8530a" opacity="0.6"/>
    <rect x="272" y="148" width="22" height="6" fill="#a8530a" opacity="0.6"/>

    <path d="M108 250v-62h30l18-18 18 18 18-18 18 18 18-18 18 18h24v62Z" fill="url(#i-fac)" stroke="#d8c3a2" stroke-width="1.5"/>
    <path d="M108 188h180v8H108Z" fill="#0e6b54" opacity="0.9"/>

    <!-- windows -->
    <g fill="#cfe6dd" stroke="#0c1f33" stroke-width="1.5">
      <rect x="122" y="206" width="26" height="20" rx="1.5"/>
      <rect x="158" y="206" width="26" height="20" rx="1.5"/>
      <rect x="194" y="206" width="26" height="20" rx="1.5"/>
    </g>
    <g fill="#0c1f33" opacity="0.6">
      <rect x="122" y="232" width="26" height="18" rx="1"/>
      <rect x="158" y="232" width="26" height="18" rx="1"/>
    </g>
    <!-- door -->
    <rect x="232" y="220" width="42" height="30" rx="2" fill="#0e6b54"/>
    <path d="M232 228h42M232 236h42M232 244h42" stroke="#0b5a46" stroke-width="1.5"/>
    <rect x="104" y="250" width="196" height="9" rx="2" fill="#dcc7a4"/>
  </g>

  <!-- gear -->
  <g transform="translate(122 150)">
    <g fill="#f2a03d">
      <circle r="17"/>
      <rect x="-4" y="-26" width="8" height="10" rx="2"/>
      <rect x="-4" y="16" width="8" height="10" rx="2"/>
      <rect x="-26" y="-4" width="10" height="8" rx="2"/>
      <rect x="16" y="-4" width="10" height="8" rx="2"/>
      <rect x="-4" y="-26" width="8" height="10" rx="2" transform="rotate(45)"/>
      <rect x="-4" y="16" width="8" height="10" rx="2" transform="rotate(45)"/>
      <rect x="-26" y="-4" width="10" height="8" rx="2" transform="rotate(45)"/>
      <rect x="16" y="-4" width="10" height="8" rx="2" transform="rotate(45)"/>
    </g>
    <circle r="7" fill="#0c1f33"/>
  </g>

  <!-- coins -->
  <circle cx="88" cy="206" r="12" fill="#f2c14e" stroke="#c89a4b" stroke-width="1.4"/>
  <text x="88" y="211" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#a8530a">&#8377;</text>
  <circle cx="324" cy="216" r="8" fill="#f6d183" stroke="#c89a4b" stroke-width="1.2" opacity="0.9"/>
</svg>
