<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" width="560" height="700" role="img" aria-label="Illustration of an Indian family with a financial advisor inside a traditional jharokha arch">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7c4"/>
      <stop offset="0.55" stop-color="#f8d3a0"/>
      <stop offset="1" stop-color="#f0b87e"/>
    </linearGradient>
    <linearGradient id="h-arch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b56"/>
      <stop offset="0.55" stop-color="#0e6b54"/>
      <stop offset="1" stop-color="#0c1f33"/>
    </linearGradient>
    <linearGradient id="h-saree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef9535"/>
      <stop offset="1" stop-color="#d96f12"/>
    </linearGradient>
    <linearGradient id="h-kurta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12866a"/>
      <stop offset="1" stop-color="#0b5a46"/>
