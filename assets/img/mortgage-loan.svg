  <circle cx="312" cy="130" r="13" fill="#f6d183" stroke="#c89a4b" stroke-width="1.4"/>
  <text x="312" y="135" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#a8530a">&#8377;</text>
  <circle cx="96" cy="150" r="8" fill="#f6d183" stroke="#c89a4b" stroke-width="1.2" opacity="0.9"/>
</svg>
